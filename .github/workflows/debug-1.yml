name: Debug Bot

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check secrets exist
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.GIHUB_REPO }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python3 << 'EOF'
          import os

          secrets = {
              "TELEGRAM_TOKEN":  os.environ.get("TELEGRAM_TOKEN"),
              "NVIDIA_API_KEY":  os.environ.get("NVIDIA_API_KEY"),
              "GITHUB_TOKEN":    os.environ.get("GIHUB_TOKEN"),
              "GITHUB_REPO":     os.environ.get("GIHUB_REPO"),
              "HF_API_KEY":      os.environ.get("HF_API_KEY"),
              "TAVILY_API_KEY":  os.environ.get("TAVILY_API_KEY"),
          }

          print("===== KIEM TRA SECRETS =====")
          all_ok = True
          for name, value in secrets.items():
              if value:
                  print(f"✅ {name}: OK (do dai: {len(value)})")
              else:
                  print(f"❌ {name}: MISSING")
                  all_ok = False

          if not all_ok:
              print("\n⚠️  Co secret bi thieu! Vao Settings > Secrets > Actions de them.")
          else:
              print("\n✅ Tat ca secrets OK!")
          EOF

      - name: Check GitHub API connection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
        run: |
          python3 << 'EOF'
          import os, requests

          token = os.environ.get("GITHUB_TOKEN")
          repo  = os.environ.get("GITHUB_REPO")

          print("===== KIEM TRA GITHUB API =====")
          if not token or not repo:
              print("❌ Thieu GITHUB_TOKEN hoac GITHUB_REPO")
          else:
              print(f"GITHUB_REPO = {repo}")
              r = requests.get(
                  f"https://api.github.com/repos/{repo}",
                  headers={"Authorization": f"token {token}"}
              )
              if r.status_code == 200:
                  print(f"✅ Ket noi GitHub repo OK: {repo}")
              elif r.status_code == 404:
                  print(f"❌ Repo khong ton tai hoac token khong co quyen: {repo}")
              elif r.status_code == 401:
                  print(f"❌ GITHUB_TOKEN sai hoac het han")
              else:
                  print(f"❌ Loi {r.status_code}: {r.text[:200]}")
          EOF

      - name: Check NVIDIA NIM connection
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 << 'EOF'
          import os, requests

          key = os.environ.get("NVIDIA_API_KEY")
          print("===== KIEM TRA NVIDIA NIM =====")
          if not key:
              print("❌ Thieu NVIDIA_API_KEY")
          else:
              r = requests.post(
                  "https://integrate.api.nvidia.com/v1/chat/completions",
                  headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                  json={"model": "meta/llama-3.1-8b-instruct", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 5},
                  timeout=20
              )
              if r.status_code == 200:
                  print("✅ NVIDIA NIM OK")
              elif r.status_code == 401:
                  print("❌ NVIDIA_API_KEY sai hoac het han")
              else:
                  print(f"❌ Loi {r.status_code}: {r.text[:200]}")
          EOF

      - name: Check Telegram Token
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python3 << 'EOF'
          import os, requests

          token = os.environ.get("TELEGRAM_TOKEN")
          print("===== KIEM TRA TELEGRAM =====")
          if not token:
              print("❌ Thieu TELEGRAM_TOKEN")
          else:
              r = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=10)
              if r.status_code == 200:
                  data = r.json()
                  bot_name = data.get("result", {}).get("username", "?")
                  print(f"✅ Telegram OK - Bot: @{bot_name}")
              else:
                  print(f"❌ TELEGRAM_TOKEN sai: {r.text[:200]}")
          EOF

      - name: Check HuggingFace connection
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          python3 << 'EOF'
          import os, requests

          key = os.environ.get("HF_API_KEY")
          print("===== KIEM TRA HUGGING FACE =====")
          if not key:
              print("❌ Thieu HF_API_KEY")
          else:
              r = requests.get(
                  "https://huggingface.co/api/whoami",
                  headers={"Authorization": f"Bearer {key}"},
                  timeout=10
              )
              if r.status_code == 200:
                  name = r.json().get("name", "?")
                  print(f"✅ HuggingFace OK - User: {name}")
              else:
                  print(f"❌ HF_API_KEY sai hoac het han: {r.status_code}")
          EOF

      - name: Check Tavily connection
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python3 << 'EOF'
          import os, requests

          key = os.environ.get("TAVILY_API_KEY")
          print("===== KIEM TRA TAVILY =====")
          if not key:
              print("❌ Thieu TAVILY_API_KEY")
          else:
              r = requests.post(
                  "https://api.tavily.com/search",
                  headers={"Content-Type": "application/json"},
                  json={"api_key": key, "query": "test", "max_results": 1},
                  timeout=10
              )
              if r.status_code == 200:
                  print("✅ Tavily OK")
              elif r.status_code == 401:
                  print("❌ TAVILY_API_KEY sai hoac het han")
              else:
                  print(f"❌ Loi {r.status_code}: {r.text[:200]}")
          EOF
